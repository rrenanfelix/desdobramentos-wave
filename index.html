<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESDOBRAMENTOS WAVE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>DESDOBRAMENTOS WAVE <small id="upd"></small></h1>
  <div class="fx" id="fx" title="Cotação BRL → ARS"></div>
  <nav id="nav">

    <button data-v="resumo">Resumo</button>

    <button data-v="conf">Config</button>

<main>
  <section id="tiles" class="tiles"></section>
  <section id="v-rodadas"></section>
  <section id="v-resumo" class="hidden"></section>
  <section id="v-nova" class="hidden"></section>

<div id="toast" class="toast hidden"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
